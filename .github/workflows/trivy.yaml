name: Docker image scan for Pull Requests
on:
  pull_request:
    types: [opened, assigned, review_requested]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      #built straight from the Dockerfile - the compose file needs the IDE around it (IDE_ROOT, the network)
      - name: Build prometheus image
        run: docker build --progress quiet -t my_site_prometheus .
      - name: Run trivy over prometheus
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_prometheus'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
