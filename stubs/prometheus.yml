# Generated by monitoring:prometheus-start - do not edit, edit the plugin's stubs/prometheus.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Any container on the IDE's network that opts in with labels, e.g. in its compose file:
  #   labels:
  #     prometheus.io/scrape: "true"
  #     prometheus.io/port: "9113"       # optional - the container's exposed port otherwise
  #     prometheus.io/path: "/metrics"   # optional
  - job_name: my-sites-ide
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: network
            values: ["__NETWORK__"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        regex: "true"
        action: keep
      # a container on several networks is listed once per network - keep the IDE's
      - source_labels: [__meta_docker_network_name]
        regex: "__NETWORK__"
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_io_port]
        regex: "(.+);(.+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        regex: "(.+)"
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service_name
      - source_labels: [__meta_docker_container_name]
        regex: "/(.+)"
        target_label: container
